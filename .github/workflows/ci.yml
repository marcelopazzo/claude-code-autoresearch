name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735 # v1.305.0
        with:
          ruby-version: "3.3"
          working-directory: mcp
          bundler-cache: true
      - run: ruby tests/library_smoke_test.rb
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mcp/Gemfile
