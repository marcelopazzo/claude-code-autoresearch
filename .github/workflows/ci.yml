name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "3.3"
          working-directory: mcp
          bundler-cache: true
      - run: ruby tests/library_smoke_test.rb
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mcp/Gemfile
