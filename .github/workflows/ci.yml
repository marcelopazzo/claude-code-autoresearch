name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.3"
          working-directory: mcp
          bundler-cache: true
      - run: ruby tests/library_smoke_test.rb
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mcp/Gemfile
