name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.3"
          working-directory: mcp
          bundler-cache: true
      - run: ruby tests/library_smoke_test.rb
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/mcp/Gemfile
